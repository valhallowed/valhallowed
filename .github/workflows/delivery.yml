# The rules of AGENTS.md § Delivering that a machine can check, on every pull
# request to main and again when it reaches the merge queue:
# scripts/check-delivery.sh. The merge gate requires the job below by its name,
# so renaming it here means renaming it in the ruleset.
#
# On a pull request it runs on pull_request_target, so that this workflow and
# the script come from main's own definition: a pull request cannot change the
# check that judges it. In the merge queue GitHub runs the queued merge's copy
# of this workflow, which checks out main and runs main's script on the pull
# request the queued merge holds; a pull request that changes this workflow
# decides what runs there, which is why it waits for a maintainer's approval
# (.github/CODEOWNERS). Either way the job checks out main,
# never the pull request's code, and only reads the pull request through the
# API. Keep it so: no checkout of the pull request's ref, and no title or body
# in a run: line.
#
# A verdict on the pull request holds as of the event that ran it: a push to an
# older pull request, or an issue linked in the sidebar, runs nothing here. The
# queue reads the pull request again before it merges. A check run belongs to a
# commit, not to a pull request, so a job named delivery in another branch's
# workflow can report on the same commit; this guards against mistakes, not
# against someone with write access who means harm.
name: delivery

on:
  pull_request_target:
    branches: [main]
    types: [opened, edited, reopened, synchronize, ready_for_review, converted_to_draft]
  merge_group:

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: delivery-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  delivery:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # main, the base of the pull request or of the queue, never the pull request's code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.merge_group.base_ref }}
          persist-credentials: false
      # A queued merge's branch is gh-readonly-queue/<base>/pr-<number>-<commit>.
      - id: queued
        name: The pull request a queued merge holds
        if: github.event_name == 'merge_group'
        env:
          HEAD_REF: ${{ github.event.merge_group.head_ref }}
        run: |
          number=${HEAD_REF##*/pr-}
          number=${number%%-*}
          if [[ ! $number =~ ^[1-9][0-9]{0,8}$ ]]; then
            echo "delivery: no pull request number in the queued merge's branch" >&2
            exit 2
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"
      - name: The rules a machine can check
        env:
          PR: ${{ github.event.pull_request.number || steps.queued.outputs.number }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: scripts/check-delivery.sh "$PR"
