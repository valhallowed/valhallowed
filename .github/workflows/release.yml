# A version tag accepts, from the registry, the images it would promote, then
# promotes exactly those digests and publishes the GitHub release. Nothing is
# rebuilt.
name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      packages: write
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
      compose_sha256: ${{ steps.accept.outputs.compose_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/promote.sh --check "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
      - id: accept
        name: Install the source images from the registry, anonymously, and accept
        env:
          VERSION: ${{ steps.check.outputs.version }}
          SOURCE: ${{ steps.check.outputs.source }}
          COMMIT: ${{ steps.check.outputs.commit }}
        run: |
          scripts/render-install.sh "$VERSION" dist/compose.yaml --pin "$SOURCE"
          scripts/accept.sh dist/compose.yaml "$COMMIT"
          echo "compose_sha256=$(sha256sum dist/compose.yaml | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Promote the accepted digests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/promote.sh "$GITHUB_REF_NAME" dist/compose.yaml

  release:
    needs: promote
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.promote.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Render the install and check it is the one accepted
        env:
          ACCEPTED: ${{ needs.promote.outputs.compose_sha256 }}
        run: |
          scripts/render-install.sh "$VERSION" dist/compose.yaml --pin
          if ! echo "$ACCEPTED  dist/compose.yaml" | sha256sum --check --status; then
            echo "release: dist/compose.yaml differs from the one acceptance passed" >&2
            exit 1
          fi
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.promote.outputs.prerelease }}
        run: |
          (cd dist && sha256sum compose.yaml > SHA256SUMS)
          flags=(--verify-tag --title "Valhallowed $VERSION" --generate-notes)
          if [[ $PRERELEASE == true ]]; then
            flags+=(--prerelease)
          else
            flags+=(--latest)
          fi
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" dist/compose.yaml dist/SHA256SUMS
