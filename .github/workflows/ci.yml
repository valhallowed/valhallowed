# The merge gate on pull requests. On main, also publish the commit channel and
# accept it from the registry. Images are built here and nowhere else (G12).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Public content
        run: scripts/check-public.sh
      - name: Workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -no-color
      - name: Shell scripts
        run: shellcheck scripts/*.sh
      - name: Schemas and contracts
        run: scripts/check-schema.sh
      - name: Images CI builds are the images a release ships
        run: scripts/check-images.sh
      - name: Python
        run: scripts/check-python.sh runtime

  build:
    needs: checks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Plugin, against the newest dedicated server
        env:
          VHD_BUILD: ${{ github.sha }}
        run: |
          docker buildx bake plugin
          scripts/check-plugin.sh dist/plugin
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build, and on main push to the commit channel
        env:
          VHD_BUILD: ${{ github.sha }}
          TAGS: ${{ steps.tag.outputs.tag }},edge
        run: |
          args=(--provenance=mode=max --sbom=true)
          if [[ $GITHUB_REF == refs/heads/main ]]; then
            args+=(--push)
          fi
          docker buildx bake "${args[@]}"

  accept:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install from the registry, anonymously, and accept
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          scripts/render-install.sh "$TAG" dist/compose.yaml --pin
          scripts/accept.sh dist/compose.yaml "$GITHUB_SHA"
