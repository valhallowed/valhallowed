# The merge gate on pull requests. On main, also publish the commit channel and
# accept it from the registry. Images are built here and nowhere else (G12).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Public content
        run: scripts/check-public.sh
      - name: Workflows
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo "$(scripts/tool-image.sh actionlint)" -no-color
      - name: Shell scripts
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo "$(scripts/tool-image.sh shellcheck)" scripts/*.sh
      - name: Schemas and contracts
        run: scripts/check-schema.sh
      - name: Images CI builds are the images a release ships
        run: scripts/check-images.sh
      - name: Python
        run: |
          scripts/check-python.sh runtime
          scripts/check-python.sh control

  # No build cache is kept between runs: the game stage holds Valve's and Iron
  # Gate's assemblies, and a cache main writes, a pull request from a fork could
  # restore.
  build:
    needs: checks
    runs-on: ubuntu-24.04
    # The game stage downloads the dedicated server; SteamCMD's tries are bounded too.
    timeout-minutes: 90
    # packages: write is used only on main, where the push step runs; a fork's
    # pull request gets a read-only token whatever this says.
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - id: game
        name: The dedicated server's current build
        run: |
          build=$(scripts/game-build.sh)
          echo "build=$build" >> "$GITHUB_OUTPUT"
      - name: Plugin, against the newest dedicated server
        env:
          GAME_BUILD: ${{ steps.game.outputs.build }}
        run: make plugin BUILD="$GITHUB_SHA"
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build, and on main push to the commit channel
        env:
          VHD_BUILD: ${{ github.sha }}
          GAME_BUILD: ${{ steps.game.outputs.build }}
          TAGS: ${{ steps.tag.outputs.tag }},edge
        run: |
          if [[ $GITHUB_REF == refs/heads/main ]]; then
            # Attestations travel with pushed images only.
            docker buildx bake --push --provenance=mode=max --sbom=true
          else
            docker buildx bake --load
          fi
      # On a pull request, the merge gate installs the local build the way a server
      # manager does; on main, accept below installs the pushed images.
      - name: Accept the local build
        if: github.ref != 'refs/heads/main'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          scripts/render-install.sh "$TAG" dist/compose.yaml
          VHD_PULL=never scripts/accept.sh dist/compose.yaml "$GITHUB_SHA"

  # promote.sh finds this job by its name; renaming it here means renaming it there.
  accept:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # accept.sh waits up to 20 minutes for the world, and prints why on a failure.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install from the registry, anonymously, and accept
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          scripts/render-install.sh "$TAG" dist/compose.yaml --pin
          scripts/accept.sh dist/compose.yaml "$GITHUB_SHA"
