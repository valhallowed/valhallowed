# Pinned dependencies move only through pull requests that pass the same checks
# as any other change. Every ecosystem lands in one weekly pull request.
version: 2
multi-ecosystem-groups:
  weekly:
    schedule:
      interval: weekly
updates:
  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: weekly
  - package-ecosystem: docker
    directories:
      - /images/control-plane
      - /images/game-runtime
      - /images/skeleton
      - /images/tools
    patterns: ["*"]
    multi-ecosystem-group: weekly
    # The checks' Python mirrors the minor version the Debian base ships, and
    # moves with the base instead: patch releases only.
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  # Not with the others: a new Debian base digest moves the package snapshot with
  # it, and its apt pins must move by hand in its own pull request, which
  # Dependabot cannot do; the rest of the week's updates need not wait for it.
  - package-ecosystem: docker
    directory: /images/debian
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directories:
      - /control
      - /runtime
    patterns: ["*"]
    multi-ecosystem-group: weekly
    # These mirror the Debian packages the images install, and move with the
    # base image instead. types-jsonschema's stubs must match that jsonschema.
    ignore:
      - dependency-name: jsonschema
      - dependency-name: jsonschema-specifications
      - dependency-name: referencing
      - dependency-name: rpds-py
      - dependency-name: attrs
      - dependency-name: types-jsonschema
  - package-ecosystem: pip
    directory: /scripts
    patterns: ["*"]
    multi-ecosystem-group: weekly
