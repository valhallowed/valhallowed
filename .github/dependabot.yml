# Pinned dependencies move only through pull requests that pass the same checks
# as any other change. Each ecosystem lands in one weekly pull request of its
# own, so an update that fails holds back only its ecosystem, and the actions'
# pull request, which changes workflows and waits for a maintainer, holds back
# nothing else. The Debian base comes on its own.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directories:
      - /images/control-plane
      - /images/data-layer
      - /images/game-runtime
      - /images/tools
      - /images/web-map
    schedule:
      interval: weekly
    groups:
      images:
        patterns: ["*"]
    # The checks' Python (images/tools) follows the minor version the Debian
    # base ships, so the checks run the Python the images do: patch releases
    # only. scripts/check-images.sh fails when the two differ.
    #
    # The plugin builds with the .NET SDK of an LTS release, and its test and
    # refcheck target that release's runtime, so a new major version moves by
    # hand with their target frameworks; scripts/check-upstream.sh reports it.
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: dotnet/sdk
        update-types: ["version-update:semver-major"]
  # Apart from the others: a new Debian base digest moves the package snapshot
  # with it, and what mirrors the snapshot moves by hand in the same pull
  # request, which Dependabot cannot do: the apt pins, the pip pins ignored
  # below, and the checks' Python minor version above. The rest of the week's
  # updates need not wait for it.
  - package-ecosystem: docker
    directory: /images/debian
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directories:
      - /control
      - /data
      - /runtime
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
    # These mirror the Debian packages the images install, and move with the
    # base image instead. types-jsonschema's stubs must match that jsonschema.
    # psycopg-binary is psycopg with libpq bundled, for the checks alone.
    ignore:
      - dependency-name: jsonschema
      - dependency-name: jsonschema-specifications
      - dependency-name: referencing
      - dependency-name: rpds-py
      - dependency-name: attrs
      - dependency-name: types-jsonschema
      - dependency-name: psycopg
      - dependency-name: psycopg-binary
  - package-ecosystem: pip
    directory: /scripts
    schedule:
      interval: weekly
    groups:
      scripts:
        patterns: ["*"]
  # The web map's packages. Node's types follow the major version of the Node
  # the image ships, which moves by hand with NODE_VERSION.
  - package-ecosystem: npm
    directory: /web-map
    schedule:
      interval: weekly
    groups:
      web-map:
        patterns: ["*"]
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
