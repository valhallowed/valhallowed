[project]
name = "vhd-data"
version = "0.0.0"
description = "The Valhallowed data layer's services: the database's supervisor and intake."
requires-python = ">=3.13"
# The image installs Debian's packages at these versions; the checks pin the same.
dependencies = ["jsonschema==4.19.2", "psycopg==3.2.6"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "PL", "RUF"]
ignore = ["PLR2004"]

[tool.ruff.lint.per-file-ignores]
"src/**/test_*.py" = ["S101", "S105", "S106", "PLR0913"]

[tool.mypy]
strict = true
mypy_path = "src"
